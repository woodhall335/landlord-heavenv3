      - landlord_address_postcode

  - id: landlord_registration
    section: Landlord Details
    question: "Northern Ireland landlord registration"
    inputType: group
    helperText: "All private landlords in Northern Ireland must register before letting. Enter the current registration number."
    fields:
      - id: landlord_registration_number
        label: "Registration number"
        inputType: text
        placeholder: "Landlord registration number"
        validation:
          required: true
        width: full
