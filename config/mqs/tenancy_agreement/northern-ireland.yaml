  # RENT BOOK REQUIREMENT (Northern Ireland)
  - id: rent_book_requirement_info
    section: Rent Details
    question: "Rent Book Requirement"
    inputType: info
    content: |
      **NORTHERN IRELAND: RENT BOOK REQUIRED**

      Article 5 of the Private Tenancies (Northern Ireland) Order 2006 requires the landlord
      of a private tenancy to provide the tenant with a rent book.

      **A compliant rent book is included in this document pack for every Northern Ireland private tenancy.**

      **The rent book must include:**
      - Landlord's name and address
      - Tenant's name
      - Property address
      - Amount of rent payable
      - Rent payment period
      - Space for recording rent payments

      Complete and give the rent book to the tenant at the start of the tenancy.

  - id: rent_book_particulars
    section: Rent Details
    question: "Rent book particulars"
    inputType: group
    helperText: "These answers populate the mandatory Northern Ireland rent book included in the pack."
    fields:
      - id: ni_capital_value
        label: "Capital value of the dwelling-house"
        inputType: text
        validation:
          required: true
        width: half
      - id: ni_rates_payable
        label: "Amount of rates payable"
        inputType: text
        placeholder: "e.g., £1,120 per year"
        validation:
          required: true
        width: half
      - id: ni_rates_liability
        label: "Who is responsible for domestic rates?"
        inputType: select
        options:
          - value: "landlord_included"
            label: "Landlord pays - included in the rent"
          - value: "tenant"
            label: "Tenant pays the full rates separately"
          - value: "apportioned"
            label: "Rates are shared or apportioned"
        validation:
          required: true
        width: full
      - id: ni_rates_explanation
        label: "Explain exactly how the rates are shared"
        inputType: textarea
        placeholder: "State each party's responsibility, amount or percentage, and when payment is due"
        dependsOn:
          questionId: ni_rates_liability
          value: "apportioned"
        validation:
          required: true
        width: full
      - id: ni_other_required_payments
        label: "Other payments required in addition to rent and rates"
        inputType: textarea
        placeholder: "State amount, description and payment period, or 'None'"
        validation:
          required: true
        width: full
    maps_to:
      - ni_capital_value
      - ni_rates_payable
      - ni_rates_liability
      - ni_rates_explanation
      - ni_other_required_payments

  # 6. Deposit
