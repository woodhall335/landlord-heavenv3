        label: "What is the deposit's current status?"
        inputType: select
        options:
          - value: "no_deposit"
            label: "No deposit is required"
          - value: "expected"
            label: "Deposit is expected but has not been received"
          - value: "received_awaiting_protection"
            label: "Received and awaiting protection"
          - value: "protected"
            label: "Protected, prescribed information not yet supplied"
          - value: "prescribed_information_supplied"
            label: "Protected and prescribed information supplied"
        validation:
          required: true
        width: full
      - id: deposit_amount
